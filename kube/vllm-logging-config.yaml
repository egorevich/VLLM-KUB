apiVersion: v1
kind: ConfigMap
metadata:
  name: vllm-logging-config
  namespace: vllm-project
data:
  logging.json: |
    {
      "version": 1,
      "disable_existing_loggers": false,
      "formatters": {
        "standard": {
          "format": "%(asctime)s %(levelname)s %(name)s pid=%(process)d %(message)s",
          "datefmt": "%Y-%m-%dT%H:%M:%S"
        }
      },
      "handlers": {
        "console": {
          "class": "logging.StreamHandler",
          "level": "INFO",
          "formatter": "standard",
          "stream": "ext://sys.stdout"
        }
      },
      "root": {
        "handlers": ["console"],
        "level": "INFO"
      },
      "loggers": {
        "vllm": {
          "handlers": ["console"],
          "level": "INFO",
          "propagate": false
        },
        "uvicorn": {
          "handlers": ["console"],
          "level": "INFO",
          "propagate": false
        },
        "uvicorn.error": {
          "handlers": ["console"],
          "level": "INFO",
          "propagate": false
        },
        "uvicorn.access": {
          "handlers": ["console"],
          "level": "INFO",
          "propagate": false
        }
      }
    }
